<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Kadr logo">
  <!-- Kadr logo: a video frame with a caption bar where one word is highlighted -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f8cff"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>
  <!-- rounded tile -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bg)"/>
  <!-- play triangle (the video) -->
  <path d="M52 30 L80 46 L52 62 Z" fill="#ffffff" opacity="0.95"/>
  <!-- caption bar: white word, highlighted yellow word, white word -->
  <rect x="20" y="78" width="88" height="26" rx="9" fill="#0f1115" opacity="0.55"/>
  <rect x="27" y="87" width="18" height="8" rx="4" fill="#ffffff"/>
  <rect x="49" y="84" width="30" height="14" rx="5" fill="#ffe100"/>
  <rect x="83" y="87" width="18" height="8" rx="4" fill="#ffffff"/>
</svg>
